name: Build and Package Windows 11 Standalone

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC C++ Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile and Sign VoiceForgeStudio.exe
        shell: pwsh
        run: |
          .\build_and_sign.ps1

      - name: Verify Executable Signature
        shell: pwsh
        run: |
          Get-AuthenticodeSignature .\VoiceForgeStudio.exe | Format-List

      - name: Package Distribution Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\VoiceForgeStudio -Force | Out-Null
          Copy-Item VoiceForgeStudio.exe dist\VoiceForgeStudio\
          Copy-Item app.py, chat_sources.py, engine_manager.py, kokoro_engine.py, audio_filter.py, scheduler.py dist\VoiceForgeStudio\
          Copy-Item index.html, reader.html, config.json, filter_rules.json, README.md dist\VoiceForgeStudio\
          Copy-Item -Recurse voices, output, browser_profile dist\VoiceForgeStudio\
          Copy-Item setup_portable_runtime.ps1, run_voiceforge.bat dist\VoiceForgeStudio\
          Compress-Archive -Path dist\VoiceForgeStudio\* -DestinationPath VoiceForgeStudio-Windows-x64.zip -Force

      - name: Upload Windows Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceForgeStudio-Windows-x64
          path: VoiceForgeStudio-Windows-x64.zip
          retention-days: 14
