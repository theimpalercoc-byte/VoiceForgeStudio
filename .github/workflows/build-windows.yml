name: Build and Package Windows 11 Standalone

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC C++ Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile and Sign VoiceForgeStudio.exe
        shell: pwsh
        run: |
          .\build_and_sign.ps1

      - name: Package Distribution Bundle
        shell: pwsh
        run: |
          $Dist = "dist\VoiceForgeStudio"
          New-Item -ItemType Directory -Path $Dist -Force | Out-Null
          New-Item -ItemType Directory -Path "$Dist\output" -Force | Out-Null
          New-Item -ItemType Directory -Path "$Dist\browser_profile" -Force | Out-Null
          New-Item -ItemType Directory -Path "$Dist\voices" -Force | Out-Null

          Copy-Item VoiceForgeStudio.exe $Dist\
          Copy-Item app.py, chat_sources.py, engine_manager.py, kokoro_engine.py, audio_filter.py, scheduler.py $Dist\
          Copy-Item index.html, reader.html, config.json, filter_rules.json, README.md $Dist\
          Copy-Item setup_portable_runtime.ps1, run_voiceforge.bat $Dist\

          if (Test-Path "voices\*") {
              Copy-Item -Recurse voices\* "$Dist\voices\" -Force
          }

          Compress-Archive -Path "$Dist\*" -DestinationPath VoiceForgeStudio-Windows-x64.zip -Force

      - name: Upload Windows Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceForgeStudio-Windows-x64
          path: VoiceForgeStudio-Windows-x64.zip
          retention-days: 14
